<!DOCTYPE html>
<html>
  <head>
    <title>Press any key to turn power on</title>
    <style>
      :fullscreen, ::backdrop {
        background-color: #000;
      }
      body, html {
        height: 100vh;
        width: 100vh;
        margin: 0;
        cursor: none;
        color: #000;
        background-color: #000;
        font-family: monospace;
        user-select: none;
        pointer-events: none;
      }
    </style>
    <script>
      if(window.location.href.match(/\?restart=true|\?restart=1/)){
        setTimeout(function(){
          window.open("/", "_self");
        }, 3000);
      } else {
        window.onlclick = function(){
          window.open("/", "_self");
        }
        window.onkeypress = function(){
          window.open("/", "_self");
        }
      }
    </script>
  </head>
  <body>
    
  </body>
</html>
